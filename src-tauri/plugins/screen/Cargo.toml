[package]
name = "tauri-plugin-rst-screen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Android screen side of realtime-screen-translator: MediaProjection capture, ONNX balloon detection, the overlay and the Keystore."
links = "tauri-plugin-rst-screen"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
