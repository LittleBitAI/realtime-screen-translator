<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>실시간 화면 인식 번역</title></head><body style='margin:0;background:#e5e7eb;color:#1f2937;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5'><div style='min-height:100vh;display:flex;flex-direction:column;max-width:960px;margin:0 auto;background:#f3f4f6'><header style='display:flex;align-items:center;justify-content:space-between;padding:16px'><div style='font-size:20px;font-weight:700'>실시간 화면 인식 번역</div><div style='font-size:14px;color:#6b7280'>일본 만화 → 한국어</div></header><main style='flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:0 16px 16px;align-content:flex-start'><section data-feature="translation-status" style='flex:1 1 300px;box-sizing:border-box;background:#ffffff;border:1px solid #d1d5db;border-radius:12px;padding:16px'><div style='display:flex;align-items:center;gap:8px'><span style='display:inline-block;width:16px;height:16px;border-radius:50%;background:#9ca3af'></span><span style='font-size:28px;font-weight:700'>번역 꺼짐</span></div><div style='font-size:14px;color:#6b7280;margin-top:4px'>켜져 있으면 이 자리가 번역 켜짐으로 바뀝니다</div><div style='margin-top:16px;padding:8px 16px;background:#e5e7eb;border-radius:8px;font-size:14px'>안내가 뜨는 자리: 키 확인, 캡처를 막아 둔 앱, Gemini 연결</div><div style='margin-top:16px;display:flex;flex-direction:column;gap:8px'><div style='display:flex;justify-content:space-between;align-items:center'><span>Gemini API 키</span><span style='display:inline-block;width:72px;height:16px;background:#d1d5db;border-radius:4px'></span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>권한</span><span style='display:inline-block;width:72px;height:16px;background:#d1d5db;border-radius:4px'></span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>지금 방식 (스크롤 / 슬라이딩)</span><span style='display:inline-block;width:72px;height:16px;background:#d1d5db;border-radius:4px'></span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>켠 뒤 Gemini 요청</span><span style='display:inline-block;width:48px;height:16px;background:#d1d5db;border-radius:4px'></span></div></div></section><section data-feature="request-permissions" style='flex:1 1 300px;box-sizing:border-box;background:#ffffff;border:1px solid #d1d5db;border-radius:12px;padding:16px'><div style='font-size:20px;font-weight:700'>권한 허용</div><div style='margin-top:8px'>화면을 읽고 번역을 그 위에 그리려면 두 가지 권한이 필요합니다.</div><div style='margin-top:16px;display:flex;flex-direction:column;gap:8px'><div style='display:flex;justify-content:space-between;align-items:center'><span>화면 캡처</span><span style='display:inline-block;width:72px;height:16px;background:#d1d5db;border-radius:4px'></span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>다른 앱 위에 표시</span><span style='display:inline-block;width:72px;height:16px;background:#d1d5db;border-radius:4px'></span></div></div><button type='button' style='margin-top:16px;width:100%;min-height:48px;border:1px solid #6b7280;border-radius:8px;background:#e5e7eb;color:#1f2937;font-size:16px;font-weight:600'>권한 허용하기</button><div style='margin-top:8px;font-size:14px;color:#6b7280'>허용하지 않으면 번역이 켜지지 않습니다. PC에서는 묻지 않습니다.</div></section></main><div style='position:sticky;bottom:0;background:#f3f4f6;border-top:1px solid #d1d5db;padding:16px 16px 8px'><button data-feature="toggle-translation" type='button' style='width:100%;height:72px;border:0;border-radius:16px;background:#4b5563;color:#ffffff;font-size:20px;font-weight:700'>번역 켜기</button><div style='margin-top:8px;text-align:center;font-size:14px;color:#6b7280'>켜면 보던 앱 위에 오버레이와 켜고 끄는 버튼이 뜹니다</div><nav style='margin-top:8px;display:flex;gap:8px'><div style='flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#d1d5db;font-weight:700'>번역</div><div style='flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#4b5563'>번역본</div><div style='flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#4b5563'>설정</div></nav></div></div></body></html>
