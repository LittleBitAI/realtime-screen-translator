<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>설정</title></head><body style='margin:0;background:#e5e7eb;color:#1f2937;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5'><div style='min-height:100vh;display:flex;flex-direction:column;max-width:960px;margin:0 auto;background:#f3f4f6'><header style='display:flex;align-items:center;justify-content:space-between;padding:16px'><div style='font-size:20px;font-weight:700'>설정</div></header><main style='flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:0 16px 16px;align-content:flex-start'><section data-feature="set-gemini-key" style='flex:1 1 300px;box-sizing:border-box;background:#ffffff;border:1px solid #d1d5db;border-radius:12px;padding:16px'><div style='font-size:20px;font-weight:700'>Gemini API 키</div><div style='margin-top:8px;display:flex;justify-content:space-between;align-items:center'><span>저장된 키 (끝 네 글자)</span><span style='display:inline-block;width:72px;height:16px;background:#d1d5db;border-radius:4px'></span></div><label style='display:block;margin-top:16px;font-size:14px;color:#6b7280'>새 키<input type='text' autocomplete='off' placeholder='발급받은 키를 붙여 넣으세요' style='display:block;box-sizing:border-box;width:100%;min-height:48px;margin-top:4px;padding:8px 16px;border:1px solid #9ca3af;border-radius:8px;background:#f3f4f6;font-size:16px;color:#1f2937'></label><div style='margin-top:4px;font-size:14px;color:#6b7280'>키 모양이 맞지 않으면 여기에 안내가 뜹니다</div><div style='margin-top:16px;display:flex;flex-wrap:wrap;gap:8px'><button type='button' style='flex:2 1 160px;min-height:48px;border:0;border-radius:8px;background:#4b5563;color:#ffffff;font-size:16px;font-weight:600'>저장</button><button type='button' style='flex:1 1 120px;min-height:48px;border:1px solid #6b7280;border-radius:8px;background:#e5e7eb;color:#1f2937;font-size:16px'>키 지우기</button></div><div style='margin-top:16px;padding:8px 16px;background:#e5e7eb;border-radius:8px;font-size:14px'>키는 이 기기에만 암호화해 저장하고, Gemini 요청 말고는 기기 밖으로 나가지 않습니다.</div></section><section style='flex:1 1 300px;box-sizing:border-box;background:#ffffff;border:1px solid #d1d5db;border-radius:12px;padding:16px'><div style='font-size:20px;font-weight:700'>번역 방식</div><div style='margin-top:16px;display:flex;flex-direction:column;gap:8px'><div style='display:flex;justify-content:space-between;align-items:center'><span>번역 모델</span><span style='color:#4b5563'>Gemini 3.1 Flash Lite</span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>옮기는 방향</span><span style='color:#4b5563'>일본어 → 한국어</span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>안전 가드레일</span><span style='color:#4b5563'>끔</span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>프리필</span><span style='color:#4b5563'>넣음</span></div><div style='display:flex;justify-content:space-between;align-items:center'><span>효과음</span><span style='color:#4b5563'>번역하지 않음</span></div></div><div style='margin-top:16px;font-size:14px;color:#6b7280'>이 항목은 고정이라 바꿀 수 없습니다.</div></section></main><div style='position:sticky;bottom:0;background:#f3f4f6;border-top:1px solid #d1d5db;padding:8px 16px'><nav style='display:flex;gap:8px'><div style='flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#4b5563'>번역</div><div style='flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#4b5563'>번역본</div><div style='flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#d1d5db;font-weight:700'>설정</div></nav></div></div></body></html>
