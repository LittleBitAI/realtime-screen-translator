{
  "openapi": "3.1.0",
  "info": {
    "title": "realtime-screen-translator",
    "version": "0.1.0"
  },
  "paths": {
    "/status": {
      "get": {
        "operationId": "P1",
        "summary": "번역이 켜져 있는지, 권한과 Gemini API 키가 갖춰졌는지, 지금 스크롤 방식인지 슬라이딩 방식인지, 켠 뒤 Gemini 요청이 몇 번 나갔는지 알려 준다. 키가 틀렸거나 캡처가 막힌 앱이면 안내 값을 함께 담는다. 로그인은 묻지 않는다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "on": {
                      "description": "bool"
                    },
                    "mode": {
                      "description": "idle | scroll | slide"
                    },
                    "key_set": {
                      "description": "bool"
                    },
                    "key_tail": {
                      "description": "string | null"
                    },
                    "capture_supported": {
                      "description": "bool (false where this host cannot capture other apps' screens: a browser, desktops other than Windows; P4 then answers capture_unsupported)"
                    },
                    "capture_allowed": {
                      "description": "bool"
                    },
                    "overlay_allowed": {
                      "description": "bool"
                    },
                    "gemini_requests": {
                      "description": "u32"
                    },
                    "source_lang": {
                      "description": "ja | en (the language the reader translates from, P13)"
                    },
                    "notice": {
                      "description": "key_invalid | capture_blocked | gemini_unreachable | detector_missing | null"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/settings/gemini-key": {
      "put": {
        "operationId": "P2",
        "summary": "Gemini API 키를 기기 보안 저장소로 암호화해 이 기기에만 저장한다. 빈 값을 보내면 키를 지운다. 저장한 키는 다시 돌려주지 않고 끝 네 글자만 알려 준다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "key": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "bool"
                    },
                    "key_tail": {
                      "description": "string | null"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/settings/source-lang": {
      "put": {
        "operationId": "P13",
        "summary": "리더가 옮길 원문 언어(일본어 ja 또는 영어 en)를 이 기기에 저장한다. 다른 값은 bad_lang으로 거절한다. 같은 그림이라도 언어마다 따로 번역해 둔다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "lang": {
                    "description": "ja | en"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "lang": {
                      "description": "ja | en"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/reader/page": {
      "post": {
        "operationId": "P12",
        "summary": "앱 안 리더가 연 만화 사이트의 페이지 그림 한 장을 번역한다(Tauri 명령 post_reader_page, 리더 스크립트만 부른다). 그림 바이트가 없으면 앱이 src를 그 사이트를 Referer로 받아 온다. 그림의 sha256과 원문 언어가 같은 페이지는 Gemini에 다시 보내지 않고 번역본에서 돌려준다. 처음 보는 페이지는 Gemini 3.1 Flash Lite에 한 번 보내(안전 설정 OFF, 프리필) 말풍선마다 글자 자리, 말풍선 자리, 원문, 한국어를 받고, 효과음·간판·화면 글자는 빼며, 사이트 페이지 하나를 번역본 하나로 저장한다. 오류: key_missing, key_invalid, gemini_unreachable, gemini_unreadable, image_unreachable, bad_image.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "src": {
                    "description": "string (the picture's address)"
                  },
                  "image": {
                    "description": "base64 string | null (the picture's bytes, when the page could read them)"
                  },
                  "page_url": {
                    "description": "string (the site page: one book per page)"
                  },
                  "title": {
                    "description": "string (the book's name)"
                  },
                  "index": {
                    "description": "u32 (the picture's place on the site page)"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "width": {
                      "description": "u32 (the picture's own pixels)"
                    },
                    "height": {
                      "description": "u32"
                    },
                    "saved": {
                      "description": "bool (true: from the library, no Gemini request)"
                    },
                    "boxes": {
                      "description": "[{x, y, w, h, radius, font_px, ko}] in the picture's own pixels: white shapes over each balloon's text, kept inside the balloon"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/permissions/request": {
      "post": {
        "operationId": "P3",
        "summary": "화면 캡처 허용과 다른 앱 위에 표시 권한을 차례로 묻고 결과를 돌려준다. Windows에서는 물을 것이 없어 둘 다 허용으로 답한다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "capture_allowed": {
                      "description": "bool"
                    },
                    "overlay_allowed": {
                      "description": "bool"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/translation/start": {
      "post": {
        "operationId": "P4",
        "summary": "키와 권한을 확인한 뒤 화면 캡처를 시작하고, 터치가 그대로 통과하는 오버레이와 켜고 끄는 버튼을 다른 앱 위에 띄운다. 버튼은 엄지가 닿는 화면 아래 가장자리 가까이에 둔다. 새 번역본을 하나 연다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "on": {
                      "description": "bool"
                    },
                    "book_id": {
                      "description": "i64"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/translation/stop": {
      "post": {
        "operationId": "P5",
        "summary": "화면 캡처와 오버레이를 거두고, 기다리던 Gemini 요청을 취소하며, 이어 붙이던 한 장과 번역본을 닫는다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "on": {
                      "description": "bool"
                    },
                    "book_id": {
                      "description": "i64 | null"
                    },
                    "picture_count": {
                      "description": "u32"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/frames": {
      "post": {
        "operationId": "P6",
        "summary": "가로 96px 흑백으로 줄인 화면 그림을 앞 그림과 견주어 멈춤, 스크롤, 페이지 넘김 가운데 하나로 가른다. 스크롤이면 밀린 거리만큼 번역 자리를 옮기고, 이미 본 범위나 이미 본 페이지로 되돌아가면 저장해 둔 번역 자리를 다시 내놓는다. 화면이 멈췄고 새로 보이는 부분이 있을 때만 감지할 범위와 저장할 띠 범위를 알려 주며, 페이지가 넘어가면 오버레이를 비우라고 알린다. 이 단계에서는 Gemini 요청을 보내지 않는다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "seq": {
                    "description": "u64"
                  },
                  "width": {
                    "description": "u32"
                  },
                  "height": {
                    "description": "u32"
                  },
                  "thumb": {
                    "description": "bytes"
                  },
                  "captured_at": {
                    "description": "i64"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "motion": {
                      "description": "still | scroll | page | blocked"
                    },
                    "dy": {
                      "description": "i32"
                    },
                    "mode": {
                      "description": "scroll | slide"
                    },
                    "picture_id": {
                      "description": "i64"
                    },
                    "detect": {
                      "description": "{top: u32, bottom: u32} | null"
                    },
                    "save": {
                      "description": "{top: u32, bottom: u32} | null"
                    },
                    "clear": {
                      "description": "bool"
                    },
                    "placements": {
                      "description": "[{id: i64, x: i32, y: i32, w: u32, h: u32, radius: u16, ko: string, font_px: u16}]"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/crops": {
      "post": {
        "operationId": "P7",
        "summary": "로컬 모델이 찾아 크롭한 말풍선 그림을 받아 지문을 뽑는다. 효과음으로 표시된 크롭과 이미 놓인 번역 자리에 절반 넘게 겹치는 크롭은 버린다. 지문이 저장된 것과 같으면 저장해 둔 번역을 바로 돌려주고, 처음 보는 크롭만 묶어 Gemini 3.1 Flash Lite에 보내 일본어 원문을 읽은 뒤 따로 한 번 더 요청해 한국어로 옮긴다. 두 요청 모두 안전 가드레일을 끄고 프리필을 붙인다. Gemini 응답은 기다리지 않고 바로 답하며, 늦게 온 번역은 P8과 이벤트로 나간다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "picture_id": {
                    "description": "i64"
                  },
                  "frame_seq": {
                    "description": "u64"
                  },
                  "crops": {
                    "description": "[{x: u32, y: u32, w: u32, h: u32, kind: dialogue | effect, score: f32, image: bytes}]"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "placed": {
                      "description": "[{id: i64, x: i32, y: i32, w: u32, h: u32, radius: u16, ko: string, font_px: u16}]"
                    },
                    "pending": {
                      "description": "u32"
                    },
                    "skipped_effects": {
                      "description": "u32"
                    },
                    "discarded": {
                      "description": "u32"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/placements": {
      "get": {
        "operationId": "P8",
        "summary": "지금 화면에 그릴 번역 자리를 화면 좌표로 돌려준다. 자리마다 흰 shape의 크기와 모서리 둥글기, 한국어, 흰 shape 안에 넘치지 않게 맞춘 글자 크기가 담긴다. 번역이 새로 돌아오면 같은 내용이 이벤트로도 나간다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "since": {
                    "description": "u64 | null"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "revision": {
                      "description": "u64"
                    },
                    "offset_y": {
                      "description": "i64"
                    },
                    "placements": {
                      "description": "[{id: i64, x: i32, y: i32, w: u32, h: u32, radius: u16, ko: string, font_px: u16}]"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/strips": {
      "post": {
        "operationId": "P9",
        "summary": "P6이 저장하라고 알려 준 범위의 깨끗한 화면 그림을 받아 앱 전용 폴더에 띠 파일로 저장하고, 번역본 그림에 이어 붙일 자리를 기록한다. 이미 저장한 범위와 스크롤해도 움직이지 않는 부분은 받지 않는다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "picture_id": {
                    "description": "i64"
                  },
                  "frame_seq": {
                    "description": "u64"
                  },
                  "top": {
                    "description": "u32"
                  },
                  "bottom": {
                    "description": "u32"
                  },
                  "image": {
                    "description": "bytes"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "strip_id": {
                      "description": "i64"
                    },
                    "picture_height": {
                      "description": "u32"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/books": {
      "get": {
        "operationId": "P10",
        "summary": "기기에 저장된 번역본을 새것부터 늘어놓고, 번역본마다 그림 수와 그림별 종류, 크기, 미리보기 경로를 돌려준다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "limit": {
                    "description": "u32"
                  },
                  "before": {
                    "description": "i64 | null"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "books": {
                      "description": "[{id: i64, title: string, started_at: i64, ended_at: i64 | null, pictures: [{id: i64, kind: stitched | page, width: u32, height: u32, closed: bool, preview_path: string}]}]"
                    },
                    "next_before": {
                      "description": "i64 | null"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/books/{book_id}/export": {
      "post": {
        "operationId": "P11",
        "summary": "번역본의 그림마다 띠를 차례로 이어 붙이고 번역 자리에 흰 shape과 한국어를 그려 넣은 그림 파일을 지어, Android에서는 갤러리에, Windows에서는 내려받기 폴더에 저장한다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "book_id": {
                    "description": "i64"
                  },
                  "format": {
                    "description": "png | webp"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "files": {
                      "description": "[string]"
                    },
                    "count": {
                      "description": "u32"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
