[workspace]
members = ["src-tauri", "xtask"]
# Built only with the app (`--features app`), not by the workspace tests.
exclude = ["src-tauri/plugins/screen"]
resolver = "2"

# Frame matching, PNG and JSON work run per frame: keep test builds fast enough
# to answer within a frame's time.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.realtime-screen-translator]
opt-level = 2
